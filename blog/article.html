<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ai:        #1b3a6b;
    --ai-mid:    #2d5a9e;
    --ai-light:  #e8eef7;
    --stone-bg:  #f7f5f0;
    --stone-bd:  #ddd8d0;
    --gold:      #b8962e;
    --text-dark: #1a1a2e;
    --text-mid:  #4a4a6a;
    --text-mute: #8888aa;
    --white:     #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--stone-bg);
    color: var(--text-dark);
    font-size: 15px;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  header {
    background: var(--ai);
    padding: 14px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .logo-en { color: rgba(255,255,255,0.5); font-size: 10px; font-weight: 400; letter-spacing: 0.1em; margin-top: 1px; }
  .logo-link { text-decoration: none; display: block; }
  header nav { display: flex; gap: 12px; align-items: center; }
  header nav a { color: rgba(255,255,255,0.8); font-size: 12px; text-decoration: none; }
  .lang-btn {
    font-size: 11px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 5px;
    padding: 3px 9px;
    color: rgba(255,255,255,0.8);
    background: transparent;
    cursor: pointer;
  }

  /* パンくず */
  .breadcrumb {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-mute);
    background: var(--stone-bg);
    border-bottom: 1px solid var(--stone-bd);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .breadcrumb a { color: var(--text-mute); text-decoration: none; }
  .breadcrumb a:hover { color: var(--text-mid); }
  .breadcrumb-sep { color: #ccc; }
  .breadcrumb-current { color: var(--text-mid); }

  /* 記事ヘッダー */
  .article-hdr {
    background: var(--ai);
    padding: 22px 16px 24px;
  }
  .article-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  .article-cat {
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 2px 8px;
  }
  .article-date { font-size: 12px; color: rgba(255,255,255,0.45); }
  .article-title {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.45;
  }

  /* 記事本文 */
  .article-body {
    background: var(--white);
    margin: 14px 12px;
    border-radius: 13px;
    border: 1px solid var(--stone-bd);
    padding: 20px 18px;
    font-size: 15px;
    line-height: 1.85;
    color: var(--text-dark);
  }
  .article-body p {
    margin-bottom: 1.2em;
  }
  .article-body p:last-child { margin-bottom: 0; }

  /* 記事内写真 */
  .article-img {
    margin: 1.4em -18px;
    overflow: hidden;
  }
  .article-img img {
    width: 100%;
    display: block;
    max-height: 320px;
    object-fit: cover;
  }
  .article-img figcaption {
    font-size: 11px;
    color: var(--text-mute);
    text-align: center;
    padding: 6px 12px 0;
    line-height: 1.5;
  }

  /* 前後記事ナビ */
  .article-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 0 12px 16px;
  }
  .article-nav a {
    background: var(--white);
    border: 1px solid var(--stone-bd);
    border-radius: 11px;
    padding: 12px 14px;
    text-decoration: none;
    color: var(--text-mid);
    font-size: 12px;
    display: block;
  }
  .article-nav a:active { opacity: 0.8; }
  .article-nav-label { font-size: 10px; color: var(--text-mute); margin-bottom: 4px; }
  .article-nav-title { font-size: 13px; font-weight: 600; color: var(--text-dark); line-height: 1.4; }
  .article-nav .next { text-align: right; }
  .article-nav .prev.empty, .article-nav .next.empty { visibility: hidden; }

  /* ブログ一覧へ戻るボタン */
  .back-btn {
    display: block;
    margin: 0 12px 14px;
    text-align: center;
    padding: 12px;
    border: 1px solid var(--stone-bd);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text-mid);
    text-decoration: none;
    background: var(--white);
  }
  .back-btn:active { opacity: 0.8; }

  /* 階段スポットへのリンク */
  .stairs-link {
    display: block;
    margin: 0 12px 20px;
    padding: 14px 16px;
    background: var(--ai-light);
    border: 1px solid #c0d0e8;
    border-radius: 12px;
    text-decoration: none;
    color: var(--ai);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .stairs-link span { font-size: 12px; font-weight: 400; color: var(--text-mid); display: block; margin-top: 3px; }

  .loading {
    text-align: center;
    color: var(--text-mute);
    padding: 60px 16px;
    font-size: 14px;
  }

  footer {
    background: var(--ai);
    padding: 18px 16px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>

<header>
  <div>
    <a href="../stairs/index.html" class="logo-link">
      <div class="logo">段旅</div>
      <div class="logo-en">StepJourney</div>
    </a>
  </div>
  <nav>
    <a href="../stairs/index.html">階段・石段スポットを探す</a>
    <button class="lang-btn" onclick="alert('英語版は準備中です。')">EN</button>
  </nav>
</header>

<div class="breadcrumb">
  <a href="../stairs/index.html">段旅</a>
  <span class="breadcrumb-sep">&gt;</span>
  <a href="index.html">階段・石段体験ブログ</a>
  <span class="breadcrumb-sep">&gt;</span>
  <span class="breadcrumb-current" id="bc-title">読み込み中...</span>
</div>

<div id="article-content"><div class="loading">読み込み中...</div></div>

<div id="article-nav-area"></div>

<a class="back-btn" href="index.html">&#8592; ブログ一覧に戻る</a>

<a class="stairs-link" href="../stairs/index.html">
  階段・石段スポットを探す
</a>

<footer>&copy; 2026 段旅 StepJourney</footer>

<script>
  function getParam(key) {
    return new URLSearchParams(location.search).get(key);
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function bodyToHtml(text) {
    // 空行で段落区切り。[image:ファイル名] または [image:ファイル名:キャプション] で写真を挿入
    return text
      .split(/\n\n+/)
      .map(para => {
        const imgMatch = para.match(/^\[image:([^\]:]+)(?::([^\]]*))?\]$/);
        if (imgMatch) {
          const filename = escapeHtml(imgMatch[1].trim());
          const caption  = imgMatch[2] ? escapeHtml(imgMatch[2].trim()) : '';
          return `<figure class="article-img">
            <img src="images/${filename}" alt="${caption || filename}" loading="lazy">
            ${caption ? `<figcaption>${caption}</figcaption>` : ''}
          </figure>`;
        }
        return `<p>${escapeHtml(para.replace(/\n/g, '<br>'))}</p>`;
      })
      .join('');
  }

  function render(article, allArticles) {
    document.title = `${article.title} - 階段・石段体験ブログ - 段旅`;
    document.getElementById('bc-title').textContent = article.title;

    document.getElementById('article-content').innerHTML = `
      <div class="article-hdr">
        <div class="article-meta">
          <span class="article-cat">${escapeHtml(article.category)}</span>
          <span class="article-date">${formatDate(article.date)}</span>
        </div>
        <div class="article-title">${escapeHtml(article.title)}</div>
      </div>
      <div class="article-body">${bodyToHtml(article.body)}</div>
    `;

    const idx = allArticles.findIndex(a => a.id === article.id);
    const prev = allArticles[idx + 1] || null;
    const next = allArticles[idx - 1] || null;

    document.getElementById('article-nav-area').innerHTML = `
      <div class="article-nav">
        <a class="prev ${prev ? '' : 'empty'}" href="${prev ? 'article.html?id=' + escapeHtml(prev.id) : '#'}">
          <div class="article-nav-label">← 前の記事</div>
          <div class="article-nav-title">${prev ? escapeHtml(prev.title) : ''}</div>
        </a>
        <a class="next ${next ? '' : 'empty'}" href="${next ? 'article.html?id=' + escapeHtml(next.id) : '#'}">
          <div class="article-nav-label">次の記事 →</div>
          <div class="article-nav-title">${next ? escapeHtml(next.title) : ''}</div>
        </a>
      </div>
    `;
  }

  const id = getParam('id');
  if (!id) {
    document.getElementById('article-content').innerHTML = '<div class="loading">記事が指定されていません。</div>';
  } else {
    fetch('data/articles.json')
      .then(r => r.json())
      .then(data => {
        const article = data.find(a => a.id === id);
        if (!article) {
          document.getElementById('article-content').innerHTML = '<div class="loading">記事が見つかりませんでした。</div>';
        } else {
          render(article, data);
        }
      })
      .catch(() => {
        document.getElementById('article-content').innerHTML = '<div class="loading">データの読み込みに失敗しました。</div>';
      });
  }
</script>
</body>
</html>
