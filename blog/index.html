<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>階段・石段体験ブログ - 段旅 StepJourney</title>

<!-- 自分のアクセス除外フラグの設定 -->
<script>
  if (new URLSearchParams(window.location.search).get('notrack') === '1') {
    localStorage.setItem('ga_exclude', 'true');
    alert('このデバイスはGA4除外に設定されました');
  }
</script>

<!-- GA4（除外フラグがない場合のみ読み込む） -->
<script>
  if (localStorage.getItem('ga_exclude') !== 'true') {
    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-FC6FWPNHRK';
    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FC6FWPNHRK');
  }
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ai:        #1b3a6b;
    --ai-mid:    #2d5a9e;
    --ai-light:  #e8eef7;
    --stone-bg:  #f7f5f0;
    --stone-bd:  #ddd8d0;
    --gold:      #b8962e;
    --text-dark: #1a1a2e;
    --text-mid:  #4a4a6a;
    --text-mute: #8888aa;
    --white:     #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--stone-bg);
    color: var(--text-dark);
    font-size: 15px;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  header {
    background: var(--ai);
    padding: 14px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .logo-en { color: rgba(255,255,255,0.5); font-size: 10px; font-weight: 400; letter-spacing: 0.1em; margin-top: 1px; }
  .logo-link { text-decoration: none; display: block; }
  header nav { display: flex; gap: 12px; align-items: center; }
  header nav a { color: rgba(255,255,255,0.8); font-size: 12px; text-decoration: none; }
  .lang-btn {
    font-size: 11px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 5px;
    padding: 3px 9px;
    color: rgba(255,255,255,0.8);
    background: transparent;
    cursor: pointer;
  }

  .blog-hero {
    background: var(--ai);
    padding: 22px 16px 28px;
  }
  .blog-hero h1 {
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .blog-hero p {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    line-height: 1.7;
  }

  /* カテゴリフィルター */
  .cat-row {
    display: flex;
    gap: 8px;
    padding: 14px 12px;
    overflow-x: auto;
    background: var(--white);
    border-bottom: 1px solid var(--stone-bd);
  }
  .cat-chip {
    flex-shrink: 0;
    font-size: 12px;
    padding: 5px 13px;
    border: 1px solid var(--stone-bd);
    border-radius: 20px;
    background: var(--stone-bg);
    color: var(--text-mid);
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-chip.active {
    background: var(--ai);
    color: #fff;
    border-color: var(--ai);
    font-weight: 600;
  }

  /* 記事カード */
  .articles { padding: 14px 12px; }

  .article-card {
    background: var(--white);
    border: 1px solid var(--stone-bd);
    border-radius: 13px;
    margin-bottom: 12px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: inherit;
  }
  .article-card:active { opacity: 0.85; }

  .article-card-body { padding: 15px 16px; }
  .article-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .article-cat {
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 2px 8px;
    letter-spacing: 0.04em;
  }
  .article-date { font-size: 12px; color: var(--text-mute); }
  .article-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.45;
    margin-bottom: 8px;
  }
  .article-summary {
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.65;
  }
  .article-more {
    font-size: 12px;
    color: var(--ai-mid);
    margin-top: 10px;
    display: block;
  }

  .no-articles {
    text-align: center;
    color: var(--text-mute);
    font-size: 14px;
    padding: 40px 0;
  }

  /* 階段スポットへのリンク */
  .stairs-link {
    display: block;
    margin: 4px 12px 20px;
    padding: 14px 16px;
    background: var(--ai-light);
    border: 1px solid #c0d0e8;
    border-radius: 12px;
    text-decoration: none;
    color: var(--ai);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .stairs-link span { font-size: 12px; font-weight: 400; color: var(--text-mid); display: block; margin-top: 3px; }

  footer {
    background: var(--ai);
    padding: 18px 16px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <div>
    <a href="../stairs/index.html" class="logo-link">
      <div class="logo">段旅</div>
      <div class="logo-en">StepJourney</div>
    </a>
  </div>
  <nav>
    <a href="../stairs/index.html">階段・石段スポットを探す</a>
    <button class="lang-btn" onclick="alert('英語版は準備中です。')">EN</button>
  </nav>
</header>

<div class="blog-hero">
  <h1>階段・石段体験ブログ</h1>
  <p>全国の階段・石段を訪れた体験や、旅のヒントを綴っています。</p>
</div>

<div class="cat-row" id="cat-row">
  <div class="cat-chip active" data-cat="">すべて</div>
</div>

<div class="articles" id="articles"></div>

<a class="stairs-link" href="../stairs/index.html">
  階段・石段スポットを探す
</a>

<footer>&copy; 2026 段旅 StepJourney</footer>

<script>
  let allArticles = [];
  let currentCat = '';

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function renderArticles(articles) {
    const container = document.getElementById('articles');
    if (articles.length === 0) {
      container.innerHTML = '<div class="no-articles">記事がありません。</div>';
      return;
    }
    container.innerHTML = articles.map(a => `
      <a class="article-card" href="article.html?id=${escapeHtml(a.id)}">
        <div class="article-card-body">
          <div class="article-meta">
            <span class="article-cat">${escapeHtml(a.category)}</span>
            <span class="article-date">${formatDate(a.date)}</span>
          </div>
          <div class="article-title">${escapeHtml(a.title)}</div>
          <div class="article-summary">${escapeHtml(a.summary)}</div>
          <span class="article-more">続きを読む →</span>
        </div>
      </a>`).join('');
  }

  function buildCategories(articles) {
    const cats = [...new Set(articles.map(a => a.category))];
    const row = document.getElementById('cat-row');
    cats.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = 'cat-chip';
      chip.dataset.cat = cat;
      chip.textContent = escapeHtml(cat);
      chip.addEventListener('click', () => filterCat(cat));
      row.appendChild(chip);
    });
  }

  function filterCat(cat) {
    currentCat = cat;
    document.querySelectorAll('.cat-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.cat === cat);
    });
    const filtered = cat === '' ? allArticles : allArticles.filter(a => a.category === cat);
    renderArticles(filtered);
  }

  document.querySelector('.cat-chip[data-cat=""]').addEventListener('click', () => filterCat(''));

  fetch('data/articles.json')
    .then(r => r.json())
    .then(data => {
      allArticles = data;
      buildCategories(data);
      renderArticles(data);
    })
    .catch(() => {
      document.getElementById('articles').innerHTML = '<div class="no-articles">記事の読み込みに失敗しました。</div>';
    });
</script>
</body>
</html>
