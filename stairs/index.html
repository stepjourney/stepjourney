<script src="../blog/data/articles.js"></script>
<script>
  let allSpots = [];

  // steps は数値（350）または文字列（"約300"）を安全に表示する
  // 数値 → "1,842"、"約300" → "約300" そのまま
  function formatSteps(val) {
    if (typeof val === 'number') return val.toLocaleString('ja-JP');
    return String(val);
  }

  const EXTS = ['jpg', 'JPG', 'png'];
  function resolveImg(baseName) {
    return new Promise(resolve => {
      let i = 0;
      function tryNext() {
        if (i >= EXTS.length) { resolve(null); return; }
        const url = `images/${baseName}.${EXTS[i++]}`;
        const img = new Image();
        img.onload  = () => resolve(url);
        img.onerror = tryNext;
        img.src = url;
      }
      tryNext();
    });
  }

  async function buildCard(spot) {
    const photoNames = (spot.images && spot.images.photos) ? spot.images.photos : [];
    let imgHTML = `<span class="spot-card-img-placeholder">写真準備中</span>`;
    if (photoNames.length > 0) {
      const url = await resolveImg(photoNames[1] ?? photoNames[0]);
      if (url) imgHTML = `<img src="${url}" alt="${spot.name}" style="width:100%;height:auto;display:block;">`;
    }
    const firstAccess = spot.access && spot.access.length > 0 ? spot.access[0] : null;
    const stationText = firstAccess
      ? `${firstAccess.line.join('・')} ${firstAccess.station} 徒歩${firstAccess.walk_minutes}分`
      : '';
    const stepsDisplay = (spot.steps !== '' && spot.steps !== null && spot.steps !== undefined)
      ? `${formatSteps(spot.steps)}<span>段</span>` : '?';
    return `
      <a class="spot-card" href="spot/${spot.id}.html">
        <div class="spot-card-img">${imgHTML}</div>
        <div class="spot-card-body">
          <div class="spot-card-name">${spot.name}</div>
          <div class="spot-card-addr">${spot.address || spot.prefecture}</div>
          <div class="spot-card-footer">
            <div class="spot-card-station">${stationText}</div>
            <div class="spot-card-steps">${stepsDisplay}</div>
          </div>
        </div>
      </a>`;
  }

  async function renderSpots(spots) {
    const container = document.getElementById('results');
    if (spots.length === 0) {
      container.innerHTML = '<div class="no-result">条件に合うスポットが見つかりませんでした。</div>';
      return;
    }
    const cards = await Promise.all(spots.map(buildCard));
    container.innerHTML = cards.join('');
  }

  function populateSelects(spots) {
    const active = spots.filter(s => s.disabled === 0);

    const prefs = [...new Set(active.map(s => s.prefecture))].sort((a, b) => {
      const order = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
      return order.indexOf(a) - order.indexOf(b);
    });
    const selPref = document.getElementById('sel-pref');
    prefs.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; selPref.appendChild(o); });

    // 段数プルダウン：数値も "約300" も数字部分でソートして昇順表示
    const stepsRaw = [...new Set(active.map(s => s.steps))];

    // ソート用に数字部分を抽出（"約300" → 300、350 → 350）
    function stepsToNum(v) {
      const n = parseInt(String(v).replace(/[^0-9]/g, ''));
      return isNaN(n) ? Infinity : n;
    }
    // プルダウン表示ラベル（"350" → "350段"、"約300" → "約300段"）
    function stepsOptionLabel(v) {
      if (typeof v === 'number') return v.toLocaleString('ja-JP') + '段';
      return String(v) + '段'; // "約300" → "約300段"
    }

    stepsRaw.sort((a, b) => stepsToNum(a) - stepsToNum(b));
    const selSteps = document.getElementById('sel-steps');
    stepsRaw.forEach(v => {
      const o = document.createElement('option');
      o.value = String(v);
      o.textContent = stepsOptionLabel(v);
      selSteps.appendChild(o);
    });

    // 最寄り駅プルダウン：access形式から駅名を収集して昇順表示
    const stationNames = [];
    active.forEach(s => {
      (s.access || []).forEach(a => {
        const label = `${a.line.join('・')} ${a.station}`;
        if (!stationNames.includes(label)) stationNames.push(label);
      });
    });
    stationNames.sort((a, b) => a.localeCompare(b, 'ja'));
    const selSt = document.getElementById('sel-station');
    stationNames.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; selSt.appendChild(o); });
  }

  function randomSample(arr, n) {
    const a = [...arr]; let i = a.length;
    while (i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a.slice(0, n);
  }

  function showPopup() {
    const popup = document.getElementById('search-popup');
    popup.style.display = 'block';
    // 検索は瞬時に終わるが、最低400ms表示してUXを確保
    setTimeout(() => { popup.style.display = 'none'; }, 800);
  }

  async function doSearch() {
    const pref = document.getElementById('sel-pref').value;
    const steps = document.getElementById('sel-steps').value;
    const station = document.getElementById('sel-station').value;
    const free = document.getElementById('inp-free').value.trim();

    const label = document.getElementById('result-label');
    const active = allSpots.filter(s => s.disabled === 0);

    if (!pref && !steps && !station && !free) {
      label.textContent = 'おすすめ階段・石段スポットを5つ表示しています♪';
      await renderSpots(randomSample(active, 5));
      return;
    }

    showPopup();
    label.textContent = '検索結果';
    const results = active.filter(s => {
      if (pref && s.prefecture !== pref) return false;
      if (steps && String(s.steps) !== steps) return false;
      if (station) {
        const labels = (s.access || []).map(a => `${a.line.join('・')} ${a.station}`);
        if (!labels.includes(station)) return false;
      }
      if (free) {
        const stationHay = (s.access || []).map(a => `${a.line.join(' ')} ${a.station}`).join(' ');
        const hay = [s.name, s.address, s.prefecture, stationHay].join(' ');
        if (!hay.includes(free)) return false;
      }
      return true;
    });
    await renderSpots(results);
  }

  // ブログ最新記事を動的読み込み（articles.jsonがない・空なら欄ごと非表示）
  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  // ブログ記事をランダムで最大3件カード表示
  function renderBlogCards() {
    const section = document.getElementById('blog-section');
    if (!articles || articles.length === 0) return;

    // ランダムシャッフルして最大3件
    const picked = [...articles].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);

    document.getElementById('blog-cards').innerHTML = picked.map(a => {
      const imgHtml = a.thumbnail
        ? `<img class="blog-card-img" src="${escapeHtml(a.thumbnail)}" alt="${escapeHtml(a.title)}" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="blog-card-img-placeholder">🪜</div>`;
      return `
        <a class="blog-card" href="../blog/articles/${escapeHtml(a.id)}.html">
          ${imgHtml}
          <div class="blog-card-body">
            <div class="blog-card-meta">${formatDate(a.date)} ・ ${escapeHtml(a.category)}</div>
            <div class="blog-card-title">${escapeHtml(a.title)}</div>
            <div class="blog-card-summary">${escapeHtml(a.summary)}</div>
            <div class="blog-card-arrow">続きを読む →</div>
          </div>
        </a>`;
    }).join('');

    section.style.display = 'block';
  }

  renderBlogCards();

    allSpots = spotsData;
    populateSelects(spotsData);
    const active = spotsData.filter(s => s.disabled === 0);
    await renderSpots(randomSample(active, 5));
  })();

  // プルダウン変更で自動検索（AND検索）
  ['sel-pref', 'sel-steps', 'sel-station'].forEach(id => {
    document.getElementById(id).addEventListener('change', doSearch);
  });
  // フリーワードはEnterキーで検索
  document.getElementById('inp-free').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
  // フリーワードは入力が止まって500ms後に自動検索
  let freeTimer;
  document.getElementById('inp-free').addEventListener('input', () => {
    clearTimeout(freeTimer);
    freeTimer = setTimeout(doSearch, 500);
  });
