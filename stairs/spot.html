<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スポット詳細 - 段旅 StepJourney</title>

<!-- 自分のアクセス除外フラグの設定 -->
<script>
  if (new URLSearchParams(window.location.search).get('notrack') === '1') {
    localStorage.setItem('ga_exclude', 'true');
    alert('このデバイスはGA4除外に設定されました');
  }
</script>

<!-- GA4（除外フラグがない場合のみ読み込む） -->
<script>
  if (localStorage.getItem('ga_exclude') !== 'true') {
    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-FC6FWPNHRK';
    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FC6FWPNHRK');
  }
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ai:        #1b3a6b;
    --ai-mid:    #2d5a9e;
    --ai-light:  #e8eef7;
    --stone-bg:  #f7f5f0;
    --stone-bd:  #ddd8d0;
    --gold:      #b8962e;
    --text-dark: #1a1a2e;
    --text-mid:  #4a4a6a;
    --text-mute: #8888aa;
    --white:     #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--stone-bg);
    color: var(--text-dark);
    font-size: 15px;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  header {
    background: var(--ai);
    padding: 14px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .logo-en { color: rgba(255,255,255,0.5); font-size: 10px; font-weight: 400; letter-spacing: 0.1em; margin-top: 1px; }
  .logo-link { text-decoration: none; display: block; }
  header nav { display: flex; gap: 12px; align-items: center; }
  header nav a { color: rgba(255,255,255,0.8); font-size: 12px; text-decoration: none; }
  .lang-btn {
    font-size: 11px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 5px;
    padding: 3px 9px;
    color: rgba(255,255,255,0.8);
    background: transparent;
    cursor: pointer;
  }

  /* パンくず */
  .breadcrumb {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-mute);
    background: var(--stone-bg);
    border-bottom: 1px solid var(--stone-bd);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .breadcrumb a { color: var(--text-mute); text-decoration: none; }
  .breadcrumb a:hover { color: var(--text-mid); }
  .breadcrumb-sep { color: #ccc; }
  .breadcrumb-current { color: var(--text-mid); }

  /* スポットヘッダー */
  .spot-hdr {
    background: var(--ai);
    padding: 22px 16px 20px;
  }
  .spot-hdr-name {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .spot-hdr-steps {
    color: #c8d8f0;
    font-size: 40px;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .spot-hdr-unit {
    font-size: 16px;
    color: rgba(255,255,255,0.45);
    font-weight: 400;
  }

  /* 写真エリア */
  .section-photos { margin: 12px 12px 0; }
  .photo-main {
    background: var(--ai-mid);
    width: 100%;
    max-height: 260px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px 13px 0 0;
    border: 1px solid var(--stone-bd);
    border-bottom: none;
  }
  .photo-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-placeholder {
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    padding: 40px 0;
  }
  .photo-thumbs {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: #ede9e2;
    overflow-x: auto;
    border: 1px solid var(--stone-bd);
    border-top: none;
    border-radius: 0 0 13px 13px;
  }
  .photo-thumb {
    flex-shrink: 0;
    width: 72px;
    height: 56px;
    border-radius: 7px;
    overflow: hidden;
    background: #ccc;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .photo-thumb.active { border-color: var(--ai); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 地図画像 */
  .map-img {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--stone-bd);
    display: block;
  }
  .map-img img {
    width: 100%;
    display: block;
    object-fit: cover;
  }
  .map-thumbs {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    overflow-x: auto;
  }
  .map-thumb {
    flex-shrink: 0;
    width: 72px;
    height: 56px;
    border-radius: 6px;
    overflow: hidden;
    background: #ccc;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .map-thumb.active { border-color: var(--ai); }
  .map-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .map-placeholder {
    background: var(--stone-bg);
    border: 1px dashed var(--stone-bd);
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--text-mute);
  }

  /* セクション共通 */
  .section {
    background: var(--white);
    margin: 12px 12px 0;
    border-radius: 13px;
    border: 1px solid var(--stone-bd);
    padding: 16px;
  }
  .section-ttl {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    border-left: 3px solid var(--gold);
    padding-left: 9px;
  }

  /* 基本情報テーブル */
  .info-row {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--stone-bd);
    font-size: 14px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label {
    color: var(--text-mute);
    font-size: 12px;
    min-width: 76px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .info-value { color: var(--text-dark); flex: 1; line-height: 1.65; }
  .info-value a {
    color: var(--ai-mid);
    font-size: 13px;
    word-break: break-all;
  }
  .station-item { margin-bottom: 7px; }
  .station-item:last-child { margin-bottom: 0; }
  .station-name { font-weight: 600; display: block; }
  .station-access { font-size: 12px; color: var(--text-mute); display: block; margin-top: 1px; }

  /* 注意情報 */
  .caution-box {
    background: var(--ai-light);
    border-left: 3px solid var(--ai-mid);
    padding: 11px 13px;
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.7;
  }

  /* 更新履歴 */
  .upd-row {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid var(--stone-bd);
    font-size: 13px;
  }
  .upd-row:last-child { border-bottom: none; }
  .upd-v { color: #ccc; min-width: 26px; font-size: 11px; }
  .upd-d { color: var(--text-mute); min-width: 88px; font-size: 12px; }
  .upd-n { color: var(--text-dark); }

  /* 戻るボタン */
  .back-btn {
    display: block;
    margin: 14px 12px 24px;
    text-align: center;
    padding: 12px;
    border: 1px solid var(--stone-bd);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text-mid);
    text-decoration: none;
    background: var(--white);
    cursor: pointer;
  }
  .back-btn:active { opacity: 0.8; }

  footer {
    background: var(--ai);
    padding: 18px 16px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
  }

  /* エラー・ローディング */
  .loading {
    text-align: center;
    color: var(--text-mute);
    padding: 60px 16px;
    font-size: 14px;
  }

  /* 階段ローディングアニメーション */
  .stair-loading { display: flex; gap: 3px; align-items: flex-end; justify-content: center; margin-bottom: 14px; }
  .stair-loading-bar {
    width: 7px;
    background: var(--ai);
    border-radius: 2px 2px 0 0;
    animation: stair-blink 1.2s ease-in-out infinite;
  }
  .stair-loading-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
  .stair-loading-bar:nth-child(2) { height: 17px; animation-delay: 0.15s; }
  .stair-loading-bar:nth-child(3) { height: 24px; animation-delay: 0.3s; }
  .stair-loading-bar:nth-child(4) { height: 31px; animation-delay: 0.45s; }
  @keyframes stair-blink {
    0%,80%,100% { opacity: 0.2; }
    40%          { opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div>
    <a href="index.html" class="logo-link">
      <div class="logo">段旅</div>
      <div class="logo-en">StepJourney</div>
    </a>
  </div>
  <nav>
    <a href="../blog/index.html">階段・石段体験ブログ</a>
    <button class="lang-btn" onclick="alert('英語版は準備中です。')">EN</button>
  </nav>
</header>

<div class="breadcrumb">
  <a href="index.html">段旅</a>
  <span class="breadcrumb-sep">&gt;</span>
  <span class="breadcrumb-current" id="bc-name">読み込み中...</span>
</div>

<div id="spot-content">
  <div class="loading">
    <div class="stair-loading">
      <div class="stair-loading-bar"></div>
      <div class="stair-loading-bar"></div>
      <div class="stair-loading-bar"></div>
      <div class="stair-loading-bar"></div>
    </div>
    読み込み中...
  </div>
</div>

<a class="back-btn" href="javascript:history.back()">&#8592; 検索結果に戻る</a>

<footer>&copy; 2026 段旅 StepJourney</footer>

<script>
  function getParam(key) {
    return new URLSearchParams(location.search).get(key);
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function formatSteps(val) {
    if (typeof val === 'number') return val.toLocaleString('ja-JP');
    return String(val);
  }

  // ベース名から実在するURLをjpg→JPG→pngの順で探す
  const EXTS = ['jpg', 'JPG', 'png'];
  function resolveImg(baseName) {
    return new Promise(resolve => {
      let i = 0;
      function tryNext() {
        if (i >= EXTS.length) { resolve(null); return; }
        const url = `images/${baseName}.${EXTS[i++]}`;
        const img = new Image();
        img.onload  = () => resolve(url);
        img.onerror = tryNext;
        img.src = url;
      }
      tryNext();
    });
  }

  async function resolveAll(names) {
    const urls = await Promise.all(names.map(resolveImg));
    return urls.filter(Boolean);
  }

  async function render(spot) {
    document.title = `${spot.name} - 段旅 StepJourney`;
    document.getElementById('bc-name').textContent = spot.name;

    const photoNames = (spot.images && spot.images.photos) ? spot.images.photos : [];
    const mapNames   = (spot.images && spot.images.maps)   ? spot.images.maps   : [];

    // 並列で拡張子を解決（写真・地図を同時に処理）
    const [photoUrls, mapUrls] = await Promise.all([
      resolveAll(photoNames),
      resolveAll(mapNames)
    ]);

    // 現地写真エリア
    const imgMain = photoUrls.length > 0
      ? `<img src="${photoUrls[0]}" alt="${spot.name} メイン写真" id="main-img" style="width:100%;height:100%;object-fit:cover;display:block;">`
      : `<div class="photo-placeholder">写真準備中</div>`;
    const thumbsHTML = photoUrls.length > 1
      ? `<div class="photo-thumbs">${photoUrls.map((url, i) =>
          `<div class="photo-thumb${i === 0 ? ' active' : ''}" data-src="${url}" data-target="main-img">
            <img src="${url}" alt="写真${i+1}" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>`).join('')}</div>`
      : '';

    // 地図エリア
    const mapMain = mapUrls.length > 0
      ? `<div class="map-img"><img src="${mapUrls[0]}" alt="${spot.name} 地図" id="main-map" style="width:100%;display:block;"></div>
         ${mapUrls.length > 1 ? `<div class="map-thumbs">${mapUrls.map((url, i) =>
           `<div class="map-thumb${i === 0 ? ' active' : ''}" data-src="${url}" data-target="main-map">
             <img src="${url}" alt="地図${i+1}" style="width:100%;height:100%;object-fit:cover;display:block;">
           </div>`).join('')}</div>` : ''}`
      : `<div class="map-placeholder">地図準備中</div>`;

    // access形式：路線・駅名・徒歩分数を表示
    const accessHTML = (spot.access && spot.access.length > 0)
      ? spot.access.map(a =>
          `<div class="station-item">
            <span class="station-name">${a.line.join('・')} ${a.station}</span>
            <span class="station-access">徒歩${a.walk_minutes}分</span>
          </div>`
        ).join('')
      : '<div class="station-item">情報なし</div>';

    const addressText = spot.address || spot.prefecture || '?';

    const stepsText = (spot.steps !== '' && spot.steps !== null && spot.steps !== undefined)
      ? `${formatSteps(spot.steps)}段` : '情報なし';

    const officialHTML = spot.official_url
      ? `<div class="info-row">
          <div class="info-label">公式サイト</div>
          <div class="info-value"><a href="${spot.official_url}" target="_blank" rel="noopener">${spot.official_url}</a></div>
        </div>` : '';

    const cautionHTML = spot.caution
      ? `<div class="section">
          <div class="section-ttl">注意情報</div>
          <div class="caution-box">${spot.caution}</div>
        </div>` : '';

    const historyHTML = (spot.history && spot.history.length > 0)
      ? spot.history.map(h =>
          `<div class="upd-row">
            <div class="upd-v">v${h.version}</div>
            <div class="upd-d">${formatDate(h.date)}</div>
            <div class="upd-n">${h.note}</div>
          </div>`).join('')
      : '<div class="upd-row"><div class="upd-n">履歴なし</div></div>';

    const stepsHdrHTML = (spot.steps !== '' && spot.steps !== null && spot.steps !== undefined)
      ? `<div class="spot-hdr-steps">${formatSteps(spot.steps)}<span class="spot-hdr-unit"> 段</span></div>`
      : '';

    document.getElementById('spot-content').innerHTML = `
      <div class="spot-hdr">
        <div class="spot-hdr-name">${spot.name}</div>
        ${stepsHdrHTML}
      </div>

      <div class="section-photos">
        <div class="section-ttl" style="margin:12px 0 8px; border-left:3px solid var(--gold); padding-left:9px; font-size:12px; font-weight:600; color:var(--text-mid);">現地写真</div>
        <div class="photo-main">${imgMain}</div>
        ${thumbsHTML}
      </div>

      <div class="section">
        <div class="section-ttl">基本情報</div>
        <div class="info-row">
          <div class="info-label">住所</div>
          <div class="info-value">${addressText}</div>
        </div>
        <div class="info-row">
          <div class="info-label">地図</div>
          <div class="info-value">${mapMain}</div>
        </div>
        <div class="info-row">
          <div class="info-label">段数</div>
          <div class="info-value">${stepsText}</div>
        </div>
        <div class="info-row">
          <div class="info-label">最寄り駅</div>
          <div class="info-value">${accessHTML}</div>
        </div>
        ${officialHTML}
      </div>

      ${cautionHTML}

      <div class="section">
        <div class="section-ttl">更新履歴</div>
        ${historyHTML}
      </div>
    `;

    // 写真・地図サムネイルのクリックイベント
    document.querySelectorAll('.photo-thumb, .map-thumb').forEach(thumb => {
      thumb.addEventListener('click', () => {
        const target = thumb.dataset.target;
        const group = thumb.classList.contains('photo-thumb') ? '.photo-thumb' : '.map-thumb';
        document.querySelectorAll(group).forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
        const img = document.getElementById(target);
        if (img) img.src = thumb.dataset.src;
      });
    });
  }

  const id = getParam('id');
  if (!id) {
    document.getElementById('spot-content').innerHTML = '<div class="loading">スポットが指定されていません。</div>';
  } else {
    fetch('data/spots.json')
      .then(r => r.json())
      .then(data => {
        const spot = data.find(s => s.id === id);
        if (!spot) {
          document.getElementById('spot-content').innerHTML = '<div class="loading">スポットが見つかりませんでした。</div>';
        } else {
          render(spot);
        }
      })
      .catch(() => {
        document.getElementById('spot-content').innerHTML = '<div class="loading">データの読み込みに失敗しました。</div>';
      });
  }
</script>
</body>
</html>
